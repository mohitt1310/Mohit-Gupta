<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <filter id="lightningGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="uttam-logo-group">
    <!-- UTT -->
    <text x="18" y="240" 
      font-family="system-ui, -apple-system, 'Segoe UI', Impact, 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="220" 
      letter-spacing="6" 
      fill="#000000">
      UTT
    </text>

    <!-- Triangle A with lightning bolt -->
    <g id="letter-A">
      <!-- Triangle Shape -->
      <polygon points="615,55 715,240 515,240" fill="#006CE5" />
      
      <!-- Electric Lightning Bolt cutting across -->
      <!-- Glow outline -->
      <polyline points="675,50 632,135 658,140 558,260" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        filter="url(#lightningGlow)"
      />
      <!-- Sharp core bolt -->
      <polyline points="675,50 632,135 658,140 558,260" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
      />
    </g>

    <!-- M -->
    <text x="725" y="240" 
      font-family="system-ui, -apple-system, 'Segoe UI', Impact, 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="220" 
      letter-spacing="6" 
      fill="#000000">
      M
    </text>

    <!-- Registered Trademark ® -->
    <g id="trademark-r" transform="translate(935, 70)">
      <circle cx="26" cy="26" r="24" fill="none" stroke="#000000" stroke-width="6.5" />
      <text x="26" y="36" 
        font-family="system-ui, -apple-system, Arial, sans-serif" 
        font-weight="900" 
        font-size="28" 
        text-anchor="middle" 
        fill="#000000">
        R
      </text>
    </g>

    <!-- Tagline: POWER AND DISTRIBUTION TRANSFORMERS -->
    <text x="500" y="325" 
      font-family="Georgia, 'Times New Roman', Times, serif" 
      font-weight="bold" 
      font-size="45" 
      letter-spacing="5" 
      text-anchor="middle" 
      fill="#000000">
      POWER AND DISTRIBUTION TRANSFORMERS
    </text>
  </g>
</svg>